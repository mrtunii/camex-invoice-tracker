# Local development services: Postgres 16 + MinIO (S3-compatible), bucket auto-created.
# Usage: docker compose up -d --wait   (reads ports/credentials from the root .env)

name: camex-invoice-tracker

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: camex
      POSTGRES_PASSWORD: camex
      POSTGRES_DB: camex
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U camex -d camex']
      interval: 2s
      timeout: 3s
      retries: 30

  # Official minio/minio images are no longer published; pgsty/minio is a maintained
  # community build of the same MinIO server (it also ships `mc` and `curl`).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    # The healthcheck also creates the bucket (idempotent, private by default), so the
    # service only reports healthy once the bucket exists and `up --wait` covers it.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mc alias set local http://localhost:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null &&
          mc mb --ignore-existing "local/$$S3_BUCKET" >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

volumes:
  postgres-data:
  minio-data:
